<svg width="1280" height="360" viewBox="0 0 1280 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#292420"/>
    </linearGradient>
    <!-- fired-clay / kiln-terracotta gradient — deliberately distinct from Filament's
         signature amber/gold, since this is a plain Laravel package, not a Filament one -->
    <linearGradient id="ember" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="55%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <circle cx="180" cy="180" r="220" fill="url(#glow)"/>

  <!-- kiln mark: a brick/oven silhouette with a fired-clay glow, not a flame icon -->
  <g transform="translate(80,95)">
    <rect x="0" y="70" width="150" height="100" rx="10" fill="#44403c"/>
    <rect x="10" y="80" width="130" height="80" rx="6" fill="#292420"/>
    <path d="M75 15
             C50 45 45 70 60 95
             C42 108 38 128 50 145
             C65 165 105 165 118 145
             C130 127 125 108 108 96
             C120 84 116 60 96 42
             C99 58 87 66 79 58
             C83 46 79 32 75 15 Z"
          fill="url(#ember)"/>
    <rect x="30" y="98" width="90" height="42" rx="4" fill="#0f0d0c" opacity="0.35"/>
  </g>

  <!-- wordmark -->
  <text x="270" y="175" font-family="Helvetica, Arial, sans-serif" font-size="88" font-weight="700" fill="#f5f5f4">Kiln</text>
  <text x="274" y="225" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="500" fill="#fb923c" letter-spacing="0.3">
    Deploy-Time OPcache Control for Laravel
  </text>

  <!-- feature chips -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#d6d3d1">
    <g transform="translate(274,268)">
      <rect width="150" height="38" rx="19" fill="#292524" stroke="#44403c"/>
      <text x="75" y="25" text-anchor="middle">artisan-first</text>
    </g>
    <g transform="translate(438,268)">
      <rect width="176" height="38" rx="19" fill="#292524" stroke="#44403c"/>
      <text x="88" y="25" text-anchor="middle">FPM-safe HTTP route</text>
    </g>
    <g transform="translate(628,268)">
      <rect width="150" height="38" rx="19" fill="#292524" stroke="#44403c"/>
      <text x="75" y="25" text-anchor="middle">zero Guzzle</text>
    </g>
  </g>

  <text x="1250" y="335" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#78716c">amjadiqbal/kiln</text>
</svg>
