name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php: [8.3, 8.4]

    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: opcache
          coverage: none
          ini-values: opcache.enable=1,opcache.enable_cli=1
      - run: composer install --no-interaction --prefer-dist
      - run: composer test
